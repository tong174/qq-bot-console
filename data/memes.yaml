# 互联网热梗库
#
# 用途: bot 会把这里的词自然融进聊天, 让语气更"网感"。
# 注意:
#   1. 不是让 AI 每句都塞梗。提示词已约束"偶尔用, 不硬凑"。
#   2. 梗有时效性, 过时的梗用了反而尴尬, 所以这里只收较耐用的。
#   3. 你可以随时增删, 改完重启 bot 生效。
#
# 格式: 每个词条给出 "梗 -> 意思/用法", AI 会按意思用。

# ---------------------------------------------------------------- 高频通用
常用:
  - 梗: 破防了
    义: 被戳中心事、情绪崩了, 常用于自嘲
  - 梗: 蚌埠住了
    义: 绷不住了、忍不住笑或哭
  - 梗: 芭比Q了
    义: 完蛋了, 事情搞砸
  - 梗: 笑不活了
    义: 笑到不行
  - 梗: 离谱
    义: 太夸张、不讲道理
  - 梗: 绝了
    义: 太好了/太糟了, 依语境定
  - 梗: 麻了
    义: 无语到麻木
  - 梗: 服了
    义: 无语又没办法
  - 梗: 有被冒犯到
    义: 玩笑式表达被惹到
  - 梗: 伤害不大侮辱性极强
    义: 形容轻飘飘但很扎人
  - 梗: 我裂开了
    义: 受不了、心态爆炸
  - 梗: 栓Q
    义: thank you 的谐音, 阴阳怪气地表达无奈或感谢
  - 梗: 退退退
    义: 赶走讨厌的东西, 开玩笑式
  - 梗: 摆烂
    义: 放弃努力, 破罐破摔
  - 梗: 躺平
    义: 不卷了, 什么都不想干
  - 梗: 内卷
    义: 过度竞争
  - 梗: 摸鱼
    义: 上班偷懒
  - 梗: 打工人
    义: 自嘲上班族
  - 梗: 牛马
    义: 自嘲像牲口一样干活
  - 梗: 电子榨菜
    义: 吃饭时看的视频
  - 梗: 精神状态
    义: 常接"领先/美丽", 形容自己很疯
  - 梗: 抽象
    义: 荒诞、难以理解

# ---------------------------------------------------------------- 夸赞 佩服
夸赞:
  - 梗: yyds
    义: 永远的神, 极致的赞美
  - 梗: 怼脸输出
    义: 直接强硬地表达
  - 梗: 你是懂XX的
    义: 你很懂行/很懂这个
  - 梗: 666
    义: 厉害
  - 梗: 秀
    义: 表现出色
  - 梗: 大冤种
    义: 吃了亏还憨憨的人, 常用于自嘲
  - 梗: 人间清醒
    义: 看得很明白
  - 梗: 神仙XX
    义: 极好的某物, 如"神仙运气"

# ---------------------------------------------------------------- 亲密 撒娇 吃醋
亲密:
  - 梗: 贴贴
    义: 亲昵地靠近
  - 梗: 你在干嘛呀
    义: 常用的撒娇式开场
  - 梗: 吃醋
    义: 直说或装可怜式表达
  - 梗: 醋坛子
    义: 爱吃醋的人
  - 梗: 宝宝
    义: 亲昵称呼
  - 梗: 抱抱
    义: 安慰的肢体接触
  - 梗: cp
    义: 配对、情侣
  - 梗: 官宣
    义: 公开恋情

# ---------------------------------------------------------------- 吐槽 损人
吐槽:
  - 梗: 你也太亚了
    义: 太土/太差
  - 梗: 电子宠物
    义: 只会吃软饭的男友, 玩笑式
  - 梗: 下头
    义: 扫兴、令人反感
  - 梗: 上头
    义: 沉迷、情绪被点燃
  - 梗: 无语子
    义: 无语
  - 梗: 小作文
    义: 长长的控诉或解释
  - 梗: 爹味
    义: 爱说教的语气, 用于吐槽对方
  - 梗: 画大饼
    义: 只会许诺不兑现
  - 梗: 空手套白狼
    义: 什么都不付出就想得到

# ---------------------------------------------------------------- 安慰 打气
安慰:
  - 梗: 抱抱你
    义: 安慰
  - 梗: 会好起来的
    义: 常见的安慰话
  - 梗: 别内耗
    义: 别自己折磨自己
  - 梗: 慢慢来
    义: 不用着急
  - 梗: 你已经很棒了
    义: 肯定对方

# ---------------------------------------------------------------- 网络缩写
缩写:
  - 梗: xswl
    义: 笑死我了
  - 梗: awsl
    义: 啊我死了, 表示被可爱到
  - 梗: emo
    义: 情绪低落
  - 梗: yyds
    义: 永远的神
  - 梗: nsdd
    义: 你说得对
  - 梗: u1s1
    义: 有一说一
  - 梗: bdjw
    义: 不懂就问
  - 梗: srds
    义: 虽然但是
  - 梗: 尊嘟假嘟
    义: 真的假的, 卖萌说法
  - 梗: 窝囊费
    义: 工资的自嘲说法
  - 梗: 电子木鱼
    义: 敲一下积功德, 解压梗
  - 梗: 显眼包
    义: 爱出风头的人
  - 梗: 松弛感
    义: 不紧绷、从容的状态
  - 梗: 情绪价值
    义: 让人舒服的能力
  - 梗: 班味
    义: 上班上出来的疲惫感
  - 梗: 差不多得了
    义: 别太过分
